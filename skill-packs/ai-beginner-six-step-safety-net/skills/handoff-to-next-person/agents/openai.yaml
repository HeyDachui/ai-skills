interface:
  display_name: "换人不丢信息 / Handoff Clearly"
  short_description: "换人或换AI时不丢信息 / Hand off without losing key context"
  default_prompt: "请使用 $handoff-to-next-person 整理一段可复制的短交接，保留目标、材料、当前结果、下一步和不能改的内容。 / Use $handoff-to-next-person to create a short copyable handoff with the goal, materials, current result, next action, and anything that must not change."
